name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-progress
      - run: composer lint

  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-progress
      - run: composer analyse

  rector:
    name: Audit maintenance advisories
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-progress
      - run: composer rector -- --dry-run

  audit:
    name: Audit security advisories
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-progress
      - run: composer audit

  test:
    name: Test (PHP ${{ matrix.php }}${{ matrix.lowest && ', lowest dependencies' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.3'
            lowest: true
    services:
      mysql:
        image: mysql:8.0
        env:
          # Laravel's default database name, so the tests need no DB_* variables.
          MYSQL_DATABASE: laravel
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - if: ${{ !matrix.lowest }}
        run: composer update --no-progress
      - if: ${{ matrix.lowest }}
        run: composer update --prefer-dist --no-interaction --no-progress --prefer-lowest --with='illuminate/*:^12.0'
      - run: composer test -- --log-junit ./test-reports/phpunit.junit.xml
